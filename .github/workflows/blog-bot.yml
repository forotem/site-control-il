name: Blog Bot - יצירת בלוג אוטומטית

on:
  # שני + חמישי בשעה 06:00 UTC (08:00 בישראל)
  schedule:
    - cron: '0 6 * * 1,4'
  
  # אפשרות להריץ ידנית
  workflow_dispatch:

jobs:
  create-blog:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
    
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      
      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      
      - name: 📦 Install root dependencies
        run: npm ci
      
      - name: 📦 Install automation dependencies
        run: |
          cd automation
          npm install
      
      - name: 🤖 Run Blog Bot
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GSC_SERVICE_ACCOUNT: ${{ secrets.GSC_SERVICE_ACCOUNT }}
        run: |
          cd automation
          node blog-bot.js
      
      - name: 📤 Commit and Push
        run: |
          git config user.name "Blog Bot"
          git config user.email "bot@site-control-il.com"
          git add -A
          if git diff --staged --quiet; then
            echo "אין שינויים"
          else
            git commit -m "📝 בלוג חדש: $(date +'%Y-%m-%d')"
            git push
          fi
